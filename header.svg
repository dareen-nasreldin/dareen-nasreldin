<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="tglow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8a0c8"/>
      <stop offset="100%" stop-color="#b55c90"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="#0d0a0f"/>

  <!-- ═══ LEFT TRACES ═══ -->

  <!-- L_top: 0,35 → 150,35 → 150,55 → 230,55 → 230,35 → 280,35 -->
  <polyline points="0,35 150,35 150,55 230,55 230,35 230,0"
            stroke="#3d1f3d" stroke-width="2" fill="none"/>
  <circle cx="150" cy="35" r="3.5" fill="#3d1f3d"/>
  <circle cx="150" cy="55" r="3.5" fill="#3d1f3d"/>
  <circle cx="230" cy="55" r="3.5" fill="#3d1f3d"/>
  <!-- Resistor on L_top (x=55–115) -->
  <rect x="52" y="29" width="66" height="12" fill="#0d0a0f"/>
  <polyline points="52,35 60,35 63,27 69,43 75,27 81,43 87,27 93,43 97,35 118,35"
            stroke="#4d2f4d" stroke-width="1.5" fill="none"/>

  <!-- L_mid: 0,100 → 110,100 → 110,75 → 200,75 → 200,100 → 280,100 -->
  <polyline points="0,100 110,100 110,75 200,75 200,100 280,100 280,0"
            stroke="#3d1f3d" stroke-width="2" fill="none"/>
  <circle cx="110" cy="100" r="3.5" fill="#3d1f3d"/>
  <circle cx="110" cy="75" r="3.5" fill="#3d1f3d"/>
  <circle cx="200" cy="75" r="3.5" fill="#3d1f3d"/>
  <circle cx="200" cy="100" r="3.5" fill="#3d1f3d"/>
  <circle cx="280" cy="100" r="3.5" fill="#3d1f3d"/>
  <!-- Capacitor on L_mid at x=153–161 on the y=75 segment -->
  <rect x="149" y="69" width="14" height="12" fill="#0d0a0f"/>
  <line x1="152" y1="68" x2="152" y2="82" stroke="#4d2f4d" stroke-width="2.5"/>
  <line x1="159" y1="68" x2="159" y2="82" stroke="#4d2f4d" stroke-width="2.5"/>

  <!-- L_bot: 0,165 → 150,165 → 150,145 → 230,145 → 230,165 → 280,165 -->
  <polyline points=" 0,165 150,165 150,145 230,145 230,165 315,165 315, 200"
            stroke="#3d1f3d" stroke-width="2" fill="none"/>
  <circle cx="150" cy="165" r="3.5" fill="#3d1f3d"/>
  <circle cx="150" cy="145" r="3.5" fill="#3d1f3d"/>
  <circle cx="230" cy="145" r="3.5" fill="#3d1f3d"/>
  <circle cx="230" cy="165" r="3.5" fill="#3d1f3d"/>
  <circle cx="315" cy="165" r="3.5" fill="#3d1f3d"/>
  <!-- NOT gate on L_bot (x=40–82) -->
  <rect x="36" y="157" width="42" height="16" fill="#0d0a0f"/>
  <polygon points="38,156 38,174 70,165" fill="#0d0a0f" stroke="#4d2f4d" stroke-width="1.5"/>
  <circle cx="74" cy="165" r="4" fill="#0d0a0f" stroke="#4d2f4d" stroke-width="1.5"/>

  <!-- ═══ RIGHT TRACES ═══ -->

  <!-- R_top: 900,35 → 750,35 → 750,55 → 670,55 → 670,35 → 620,35 -->
  <polyline points="900,35 750,35 750,55 670,55 670,35 620,35 360,35 360, 0"
            stroke="#3d1f3d" stroke-width="2" fill="none"/>
  <circle cx="750" cy="35" r="3.5" fill="#3d1f3d"/>
  <circle cx="750" cy="55" r="3.5" fill="#3d1f3d"/>
  <circle cx="670" cy="55" r="3.5" fill="#3d1f3d"/>
  <circle cx="670" cy="35" r="3.5" fill="#3d1f3d"/>
  <circle cx="360" cy="35" r="3.5" fill="#3d1f3d"/>
  <!-- Resistor on R_top (x=785–845) -->
  <rect x="782" y="29" width="66" height="12" fill="#0d0a0f"/>
  <polyline points="782,35 790,35 793,27 799,43 805,27 811,43 817,27 823,43 827,35 848,35"
            stroke="#4d2f4d" stroke-width="1.5" fill="none"/>

  <!-- R_mid: 900,100 → 790,100 → 790,75 → 700,75 → 700,100 → 620,100 -->
  <polyline points="900,100 790,100 790,75 680,75 680,140 620,140 580,140 350,140 350,200"
            stroke="#3d1f3d" stroke-width="2" fill="none"/>
  <circle cx="790" cy="100" r="3.5" fill="#3d1f3d"/>
  <circle cx="790" cy="75" r="3.5" fill="#3d1f3d"/>
  <circle cx="680" cy="75" r="3.5" fill="#3d1f3d"/>
  <circle cx="680" cy="140" r="3.5" fill="#3d1f3d"/>
  <circle cx="350" cy="140" r="3.5" fill="#3d1f3d"/>
  <!-- Capacitor on R_mid at x=739–747 on the y=75 segment -->
  <rect x="736" y="69" width="14" height="12" fill="#0d0a0f"/>
  <line x1="739" y1="68" x2="739" y2="82" stroke="#4d2f4d" stroke-width="2.5"/>
  <line x1="746" y1="68" x2="746" y2="82" stroke="#4d2f4d" stroke-width="2.5"/>

  <!-- R_bot: AND gate output (825,165) → 800,165 → 800,125 → 705,125 → 705,175 → 450,175 → 450,200 -->
  <polyline points="825,165 800,165 800,125 705,125 705,175 450,175 450,200"
            stroke="#3d1f3d" stroke-width="2" fill="none"/>
  <circle cx="800" cy="165" r="3.5" fill="#3d1f3d"/>
  <circle cx="800" cy="125" r="3.5" fill="#3d1f3d"/>
  <circle cx="705" cy="125" r="3.5" fill="#3d1f3d"/>
  <circle cx="705" cy="175" r="3.5" fill="#3d1f3d"/>
  <circle cx="450" cy="175" r="3.5" fill="#3d1f3d"/>
  <!-- AND gate: 2 inputs from right (y=152, y=178), 1 output left at y=165 -->
  <line x1="900" y1="152" x2="864" y2="152" stroke="#3d1f3d" stroke-width="2"/>
  <line x1="900" y1="178" x2="864" y2="178" stroke="#3d1f3d" stroke-width="2"/>
  <!-- AND gate on R_bot — flipped, output faces left -->
  <rect x="825" y="157" width="39" height="16" fill="#0d0a0f"/>
  <path d="M864,152 L849,152 Q825,152 825,165 Q825,178 849,178 L864,178 Z"
        fill="#0d0a0f" stroke="#4d2f4d" stroke-width="1.5"/>
  <!-- ═══ CENTER TEXT ═══ -->
  <text x="450" y="96" text-anchor="middle"
        font-family="Consolas, 'Cascadia Code', 'Cascadia Mono', monospace"
        font-size="34" font-weight="bold"
        fill="url(#tg)" filter="url(#tglow)">DAREEN NASRELDIN</text>
  <text x="450" y="124" text-anchor="middle"
        font-family="Consolas, 'Cascadia Code', 'Cascadia Mono', monospace"
        font-size="14.5" letter-spacing="2" fill="#7a4a6a">COMPUTER ENGINEERING  ·  UNIVERSITY OF TORONTO </text>

  <!-- ═══ PULSE PATHS (invisible guides) ═══ -->
  <path id="p1" d="M0,35 L150,35 L150,55 L230,55 L230,35 L230,0" fill="none"/>
  <path id="p2" d="M0,100 L110,100 L110,75 L200,75 L200,100 L280,100 L280,0" fill="none"/>
  <path id="p3" d="M0,165 L150,165 L150,145 L230,145 L230,165 L315,165 L315,200" fill="none"/>
  <path id="p4" d="M900,35 L750,35 L750,55 L670,55 L670,35 L620,35 L360,35 L360,0" fill="none"/>
  <path id="p5" d="M900,100 L790,100 L790,75 L680,75 L680,140 L620,140 L580,140 L350,140 L350,200" fill="none"/>
  <path id="p7" d="M900,152 L864,152 L825,165 L800,165 L800,125 L705,125 L705,175 L450,175 L450,200" fill="none"/>
  <path id="p8" d="M900,178 L864,178 L825,165 L800,165 L800,125 L705,125 L705,175 L450,175 L450,200" fill="none"/>

  <!-- ═══ ANIMATED PULSES ═══ -->

  <!-- Pulse 1 (L_top) — begin=0s, no delay so no visibility fix needed -->
  <circle r="6" fill="#b55c90" filter="url(#glow)">
    <animateMotion dur="2.4s" repeatCount="indefinite" begin="0s">
      <mpath xlink:href="#p1" href="#p1"/>
    </animateMotion>
  </circle>
  <circle r="2.5" fill="#fce4f0">
    <animateMotion dur="2.4s" repeatCount="indefinite" begin="0s">
      <mpath xlink:href="#p1" href="#p1"/>
    </animateMotion>
  </circle>

  <!-- Pulse 2 (L_mid) -->
  <circle r="6" fill="#b55c90" filter="url(#glow)" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="0.9s"/>
    <animateMotion dur="2.8s" repeatCount="indefinite" begin="0.9s">
      <mpath xlink:href="#p2" href="#p2"/>
    </animateMotion>
  </circle>
  <circle r="2.5" fill="#fce4f0" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="0.9s"/>
    <animateMotion dur="2.8s" repeatCount="indefinite" begin="0.9s">
      <mpath xlink:href="#p2" href="#p2"/>
    </animateMotion>
  </circle>

  <!-- Pulse 3 (L_bot) -->
  <circle r="6" fill="#c97aab" filter="url(#glow)" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="1.8s"/>
    <animateMotion dur="3.1s" repeatCount="indefinite" begin="1.8s">
      <mpath xlink:href="#p3" href="#p3"/>
    </animateMotion>
  </circle>
  <circle r="2.5" fill="#fce4f0" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="1.8s"/>
    <animateMotion dur="3.1s" repeatCount="indefinite" begin="1.8s">
      <mpath xlink:href="#p3" href="#p3"/>
    </animateMotion>
  </circle>

  <!-- Pulse 4 (R_top) -->
  <circle r="6" fill="#b55c90" filter="url(#glow)" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="0.4s"/>
    <animateMotion dur="2.4s" repeatCount="indefinite" begin="0.4s">
      <mpath xlink:href="#p4" href="#p4"/>
    </animateMotion>
  </circle>
  <circle r="2.5" fill="#fce4f0" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="0.4s"/>
    <animateMotion dur="2.4s" repeatCount="indefinite" begin="0.4s">
      <mpath xlink:href="#p4" href="#p4"/>
    </animateMotion>
  </circle>

  <!-- Pulse 5 (R_mid) -->
  <circle r="6" fill="#b55c90" filter="url(#glow)" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="1.3s"/>
    <animateMotion dur="2.8s" repeatCount="indefinite" begin="1.3s">
      <mpath xlink:href="#p5" href="#p5"/>
    </animateMotion>
  </circle>
  <circle r="2.5" fill="#fce4f0" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="1.3s"/>
    <animateMotion dur="2.8s" repeatCount="indefinite" begin="1.3s">
      <mpath xlink:href="#p5" href="#p5"/>
    </animateMotion>
  </circle>

  <!-- Pulse 7 (AND top input → converges → output) -->
  <circle r="6" fill="#c97aab" filter="url(#glow)">
    <animateMotion dur="4s" repeatCount="indefinite" begin="0s">
      <mpath xlink:href="#p7" href="#p7"/>
    </animateMotion>
  </circle>
  <circle r="2.5" fill="#fce4f0">
    <animateMotion dur="4s" repeatCount="indefinite" begin="0s">
      <mpath xlink:href="#p7" href="#p7"/>
    </animateMotion>
  </circle>

  <!-- Pulse 8 (AND bottom input → converges → output) -->
  <circle r="6" fill="#c97aab" filter="url(#glow)">
    <animateMotion dur="4s" repeatCount="indefinite" begin="0s">
      <mpath xlink:href="#p8" href="#p8"/>
    </animateMotion>
  </circle>
  <circle r="2.5" fill="#fce4f0">
    <animateMotion dur="4s" repeatCount="indefinite" begin="0s">
      <mpath xlink:href="#p8" href="#p8"/>
    </animateMotion>
  </circle>

</svg>
